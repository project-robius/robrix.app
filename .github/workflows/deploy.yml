name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Builds for robrix.app, which is where Pages serves this. To stage on another
    # host instead, add `env: { SITE_URL: https://<host> }` here: canonical URLs,
    # og:image, the sitemap and robots.txt all follow it, and any host other than
    # robrix.app is built noindex — so the host named must be the one serving it.
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v5
